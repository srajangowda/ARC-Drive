name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
      - master      # triggers on push to main or master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────
  # JOB 1: BUILD
  # ─────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: false   # Prevents warnings from being treated as errors

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/   # Vite outputs to dist/

  # ─────────────────────────────────────
  # JOB 2: DEPLOY (only on main/master push)
  # ─────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy files to EC2 via rsync
        run: |
          # Strip any random invisible spaces or newlines pasted into GitHub Secrets
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d ' \r\n')
          
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            dist/ \
            ubuntu@${EC2_HOST}:/var/www/frontend/

      - name: Reload Nginx
        run: |
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d ' \r\n')

          ssh -o StrictHostKeyChecking=no \
            ubuntu@${EC2_HOST} \
            "sudo systemctl reload nginx"

      - name: Deployment Success
        run: echo "✅ ARC Drive deployed successfully to EC2!"

