name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
      - master      # triggers on push to main or master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────
  # JOB 1: BUILD
  # ─────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: false   # Prevents warnings from being treated as errors

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/   # Vite outputs to dist/

  # ─────────────────────────────────────
  # JOB 2: DEPLOY (only on main/master push)
  # ─────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy files to EC2 via rsync
        run: |
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d ' \r\n')
          EC2_USER=$(echo "${{ secrets.EC2_USER }}" | tr -d ' \r\n')
          
          # Debug: Verify SSH agent is working
          echo "🔍 Verifying SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${EC2_USER}@${EC2_HOST} "echo '✅ SSH connection successful'" || {
            echo "❌ SSH connection failed!"
            echo "EC2_HOST: ${EC2_HOST}"
            echo "EC2_USER: ${EC2_USER}"
            exit 1
          }
          
          # Deploy using rsync
          echo "📤 Uploading files to EC2..."
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
            dist/ \
            ${EC2_USER}@${EC2_HOST}:/var/www/html/ || {
            echo "❌ rsync failed!"
            echo "Possible causes:"
            echo "1. EC2_SSH_KEY secret not set in GitHub secrets"
            echo "2. SSH key format incorrect (must be PEM format)"
            echo "3. Public key not authorized on EC2 instance"
            echo "4. EC2_USER is wrong (try: ec2-user for Amazon Linux, ubuntu for Ubuntu)"
            exit 1
          }
          
          echo "✅ Files uploaded successfully"

      - name: Reload Nginx
        run: |
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d ' \r\n')
          EC2_USER=$(echo "${{ secrets.EC2_USER }}" | tr -d ' \r\n')

          echo "🔄 Reloading Nginx on EC2..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${EC2_USER}@${EC2_HOST} \
            "sudo systemctl reload nginx && echo '✅ Nginx reloaded successfully'" || {
            echo "⚠️  Nginx reload failed (may not have sudo access or nginx not installed)"
          }

      - name: Deployment Success
        run: echo "✅ ARC Drive deployed successfully to EC2!"

